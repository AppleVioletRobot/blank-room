<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Blank Room: a reusable enterable graphic scaffold." />
    <title>Blank Room</title>
  </head>
  <body>
    <div id="app">
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <p class="eyebrow">Blank Room v0.1</p>
          <h1>Enter the room</h1>
          <p>Use WASD or the arrow keys to move. Move the mouse to look around. Press Esc to release the mouse.</p>
          <button id="enter-button" type="button">Enter room</button>
        </div>
      </div>
      <div id="hud" class="hud" aria-live="polite">Blank Room</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
